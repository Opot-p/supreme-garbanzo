<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - EduPro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/html/index.html" class="logo">📚 EduPro</a>
            <ul class="nav-links">
                <li><a href="/html/index.html">Главная</a></li>
                <li><a href="/html/courses.html">Курсы</a></li>
                <li class="guest-only"><a href="/html/login.html">Вход</a></li>
                <li class="guest-only"><a href="/html/register.html" class="active">Регистрация</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 class="form-title">Регистрация</h2>
            <form data-handler="register">
                <div class="form-group">
                    <label for="name">ФИО *</label>
                    <input type="text" id="name" name="name" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label for="login">Логин *</label>
                    <input type="text" id="login" name="login" required placeholder="Придумайте логин">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" required placeholder="Придумайте пароль">
                </div>
                <div class="form-group">
                    <label for="role">Тип аккаунта</label>
                    <select id="role" name="role">
                        <option value="student">Студент (хочу учиться)</option>
                        <option value="teacher" disabled>Преподаватель (создаётся админом)</option>
                    </select>
                    <small style="color: var(--text-secondary); font-size: 0.75rem;">* Преподавателя может создать только администратор</small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
                Уже есть аккаунт? <a href="/html/login.html" style="color: var(--primary-color);">Войти</a>
            </p>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
