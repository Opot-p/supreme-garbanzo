<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Онлайн Обучение</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">OnlineLearn</a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="courses.html">Курсы</a></li>
                    <li><a href="login.html">Вход</a></li>
                    <li><a href="register.html" class="active">Регистрация</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <h2>Регистрация нового пользователя</h2>
                    
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">Логин</label>
                            <input type="text" id="username" name="username" required placeholder="Придумайте логин">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </form>
                    
                    <p class="auth-link">
                        Уже есть аккаунт? <a href="login.html">Войти</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 OnlineLearn. Все права защищены.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
