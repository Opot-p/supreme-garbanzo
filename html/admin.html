<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - EduPro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/html/index.html" class="logo">📚 EduPro</a>
            <ul class="nav-links">
                <li><a href="/html/admin.html" class="active">Админ-панель</a></li>
                <li><a href="/html/courses.html">Курсы</a></li>
                <li class="auth-only" style="display: none;">
                    <span class="user-badge user-role"></span>
                </li>
                <li class="auth-only user-name" style="display: none;"></li>
                <li class="auth-only" style="display: none;">
                    <a href="#" onclick="logout()" class="btn btn-danger btn-sm">Выход</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 style="color: white; margin-bottom: 2rem;">Панель администратора</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Всего пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalTeachers">0</div>
                <div class="stat-label">Преподавателей</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Студентов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCourses">0</div>
                <div class="stat-label">Курсов</div>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="card">
                <h3 class="card-title">➕ Создать преподавателя</h3>
                <form id="createTeacherForm">
                    <div class="form-group">
                        <label for="teacherName">ФИО *</label>
                        <input type="text" id="teacherName" required>
                    </div>
                    <div class="form-group">
                        <label for="teacherLogin">Логин *</label>
                        <input type="text" id="teacherLogin" required>
                    </div>
                    <div class="form-group">
                        <label for="teacherPassword">Пароль *</label>
                        <input type="password" id="teacherPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="teacherEmail">Email</label>
                        <input type="email" id="teacherEmail">
                    </div>
                    <button type="submit" class="btn btn-primary">Создать преподавателя</button>
                </form>
            </div>

            <div class="card">
                <h3 class="card-title">👥 Все пользователи</h3>
                <div class="table-container" style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя</th>
                                <th>Логин</th>
                                <th>Роль</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 1.5rem;">
            <h3 class="card-title">📊 Управление курсами</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1rem;">Администратор может просматривать все курсы и управлять ими</p>
            <a href="/html/courses.html" class="btn btn-secondary">Перейти к курсам</a>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверка прав администратора
            if (!currentUser || currentUser.role !== 'admin') {
                window.location.href = '/html/index.html';
                return;
            }

            loadStats();
            setupTeacherForm();
        });

        async function loadStats() {
            const users = await getAllUsers();
            const courses = await getCourses();

            const teachers = users.filter(u => u.role === 'teacher');
            const students = users.filter(u => u.role === 'student');

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalTeachers').textContent = teachers.length;
            document.getElementById('totalStudents').textContent = students.length;
            document.getElementById('totalCourses').textContent = courses.length;

            // Заполнение таблицы пользователей
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';
            
            const roleNames = {
                'admin': '👑 Админ',
                'teacher': '👨‍🏫 Преподаватель',
                'student': '🎓 Студент'
            };

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.login}</td>
                    <td>${roleNames[user.role] || user.role}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setupTeacherForm() {
            document.getElementById('createTeacherForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const name = document.getElementById('teacherName').value;
                const login = document.getElementById('teacherLogin').value;
                const password = document.getElementById('teacherPassword').value;
                const email = document.getElementById('teacherEmail').value;

                const result = await createTeacher(login, password, name, email);
                
                if (result) {
                    document.getElementById('createTeacherForm').reset();
                    loadStats();
                }
            });
        }
    </script>
</body>
</html>
