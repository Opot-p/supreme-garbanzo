<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Онлайн Обучение</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">OnlineLearn</a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="courses.html">Курсы</a></li>
                    <li><a href="login.html">Вход</a></li>
                    <li><a href="register.html">Регистрация</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card" style="max-width: 500px; margin: 0 auto;">
                <h2>Вход в систему</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn" style="width: 100%;">Войти</button>
                </form>
                
                <p style="margin-top: 20px; text-align: center;">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
                
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">
                    <h4>Тестовые учетные записи:</h4>
                    <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">
                        <strong>Админ:</strong> admin / admin123<br>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 OnlineLearn. Все права защищены.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
