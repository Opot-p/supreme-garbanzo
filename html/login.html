<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Онлайн Обучение</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">OnlineLearn</a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="courses.html">Курсы</a></li>
                    <li><a href="login.html" class="active">Вход</a></li>
                    <li><a href="register.html">Регистрация</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <h2>Вход в систему</h2>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Логин</label>
                            <input type="text" id="username" name="username" required placeholder="Введите ваш логин">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password" required placeholder="Введите ваш пароль">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </form>
                    
                    <p class="auth-link">
                        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                    </p>
                    
                    <div class="demo-accounts">
                        <h4>Тестовые учетные записи:</h4>
                        <div class="demo-item">
                            <strong>Администратор:</strong><br>
                            Логин: <code>admin</code><br>
                            Пароль: <code>admin123</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 OnlineLearn. Все права защищены.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
