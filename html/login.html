<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - EduPro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/html/index.html" class="logo">📚 EduPro</a>
            <ul class="nav-links">
                <li><a href="/html/index.html">Главная</a></li>
                <li><a href="/html/courses.html">Курсы</a></li>
                <li class="guest-only"><a href="/html/login.html" class="active">Вход</a></li>
                <li class="guest-only"><a href="/html/register.html">Регистрация</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 class="form-title">Вход в систему</h2>
            <form data-handler="login">
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" required placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
                Нет аккаунта? <a href="/html/register.html" style="color: var(--primary-color);">Зарегистрироваться</a>
            </p>
            <div style="margin-top: 1rem; padding: 1rem; background: rgba(79, 70, 229, 0.1); border-radius: 8px;">
                <p style="font-size: 0.875rem; color: var(--text-secondary);"><strong>Тестовый вход:</strong></p>
                <p style="font-size: 0.875rem;">Админ: <code>admin / admin123</code></p>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
