<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уроки курса - EduPro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/html/index.html" class="logo">📚 EduPro</a>
            <ul class="nav-links">
                <li><a href="/html/courses.html">Курсы</a></li>
                <li class="auth-only" style="display: none;">
                    <span class="user-badge user-role"></span>
                </li>
                <li class="auth-only user-name" style="display: none;"></li>
                <li class="auth-only" style="display: none;">
                    <a href="#" onclick="logout()" class="btn btn-danger btn-sm">Выход</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 id="courseTitle" style="color: white; margin-bottom: 2rem;"></h1>
        
        <div id="lessonsList" class="grid">
            <!-- Уроки будут загружены здесь -->
        </div>
    </main>

    <!-- Модальное окно для теста -->
    <div id="testModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Тест</h3>
                <button class="modal-close" onclick="closeModal('testModal')">&times;</button>
            </div>
            <div id="testContent"></div>
        </div>
    </div>

    <!-- Модальное окно для практики -->
    <div id="practiceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Практическое задание</h3>
                <button class="modal-close" onclick="closeModal('practiceModal')">&times;</button>
            </div>
            <div id="practiceTask" style="margin-bottom: 1rem;"></div>
            <div class="form-group">
                <label for="assignmentFile">Прикрепить файл с решением</label>
                <textarea id="assignmentContent" rows="6" placeholder="Введите текст решения или описание файла..."></textarea>
            </div>
            <div class="form-group">
                <label for="assignmentFileName">Название файла</label>
                <input type="text" id="assignmentFileName" placeholder="solution.txt">
            </div>
            <button class="btn btn-primary" onclick="submitPractice()">Отправить работу</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let currentCourseId = null;
        let currentLessonId = null;
        let currentTest = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!currentUser) {
                window.location.href = '/html/login.html';
                return;
            }

            currentCourseId = localStorage.getItem('currentCourseId');
            if (!currentCourseId) {
                showAlert('Курс не выбран', 'error');
                window.location.href = currentUser.role === 'student' ? '/html/student.html' : '/html/teacher.html';
                return;
            }

            await loadLessons();
        });

        async function loadLessons() {
            const courses = await getCourses();
            const course = courses.find(c => c.id == currentCourseId);
            
            if (course) {
                document.getElementById('courseTitle').textContent = `📚 ${course.title}`;
            }

            try {
                const response = await fetch(`/php/api.php?action=get_lessons&courseId=${currentCourseId}`);
                const data = await response.json();
                
                if (data.success) {
                    renderLessons(data.lessons);
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderLessons(lessons) {
            const container = document.getElementById('lessonsList');
            container.innerHTML = '';

            if (lessons.length === 0) {
                container.innerHTML = '<p style="color: white; text-align: center;">В этом курсе пока нет уроков</p>';
                return;
            }

            const typeLabels = {
                'text': '📄 Текст',
                'video': '🎥 Видео',
                'test': '✅ Тест',
                'practice': '📝 Практика'
            };

            lessons.forEach((lesson, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const typeClass = `type-${lesson.type}`;
                const typeLabel = typeLabels[lesson.type] || lesson.type;
                
                let actionButton = '';
                
                if (lesson.type === 'test') {
                    actionButton = `<button class="btn btn-primary btn-sm" onclick="openTest(${lesson.id})">Пройти тест</button>`;
                } else if (lesson.type === 'practice') {
                    actionButton = `<button class="btn btn-primary btn-sm" onclick="openPractice(${lesson.id}, '${escapeHtml(lesson.content)}')">Выполнить</button>`;
                } else if (lesson.type === 'video') {
                    actionButton = lesson.content ? `<a href="${lesson.content}" target="_blank" class="btn btn-secondary btn-sm">Смотреть видео</a>` : '';
                }

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                        <h4 class="card-title">${index + 1}. ${escapeHtml(lesson.title)}</h4>
                        <span class="lesson-type-badge ${typeClass}">${typeLabel}</span>
                    </div>
                    ${lesson.type === 'text' ? `<p style="color: var(--text-secondary);">${escapeHtml(lesson.content)}</p>` : ''}
                    ${lesson.type === 'video' && lesson.content ? `
                        <div style="margin: 1rem 0;">
                            <iframe width="100%" height="315" src="${getVideoEmbedUrl(lesson.content)}" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>
                        </div>
                    ` : ''}
                    <div style="margin-top: 1rem;">${actionButton}</div>
                `;
                
                container.appendChild(card);
            });
        }

        function getVideoEmbedUrl(url) {
            const videoId = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/)?.[1];
            if (videoId) {
                return `https://www.youtube.com/embed/${videoId}`;
            }
            return url;
        }

        async function openTest(lessonId) {
            try {
                const response = await fetch(`/php/api.php?action=get_test&lessonId=${lessonId}`);
                const data = await response.json();
                
                if (data.success && data.test) {
                    currentTest = data.test;
                    currentLessonId = lessonId;
                    
                    // Проверяем, проходил ли уже студент этот тест
                    const resultResponse = await fetch(`/php/api.php?action=get_test_result&testId=${data.test.id}`);
                    const resultData = await resultResponse.json();
                    
                    if (resultData.success && resultData.answer) {
                        showAlert('Вы уже прошли этот тест', 'warning');
                        return;
                    }
                    
                    renderTest(data.test);
                    openModal('testModal');
                } else {
                    showAlert('Тест ещё не создан преподавателем', 'warning');
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderTest(test) {
            const container = document.getElementById('testContent');
            container.innerHTML = '';

            test.questions.forEach((question, index) => {
                const div = document.createElement('div');
                div.style.cssText = 'margin-bottom: 1.5rem; padding: 1rem; background: #f9fafb; border-radius: 8px;';
                
                let optionsHtml = '';
                question.options.forEach((option, optIndex) => {
                    optionsHtml += `
                        <label style="display: block; padding: 0.5rem; cursor: pointer;">
                            <input type="radio" name="q${index}" value="${optIndex}" style="margin-right: 0.5rem;">
                            ${escapeHtml(option)}
                        </label>
                    `;
                });

                div.innerHTML = `
                    <p style="font-weight: 600; margin-bottom: 0.5rem;">${index + 1}. ${escapeHtml(question.text)}</p>
                    ${optionsHtml}
                `;
                container.appendChild(div);
            });

            const submitBtn = document.createElement('button');
            submitBtn.className = 'btn btn-primary';
            submitBtn.textContent = 'Отправить ответы';
            submitBtn.onclick = submitTestAnswers;
            container.appendChild(submitBtn);
        }

        async function submitTestAnswers() {
            if (!currentTest) return;

            const answers = {};
            let allAnswered = true;

            currentTest.questions.forEach((_, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    answers[index] = parseInt(selected.value);
                } else {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                showAlert('Ответьте на все вопросы', 'error');
                return;
            }

            const result = await submitTest(currentTest.id, answers);
            if (result) {
                closeModal('testModal');
                const gradeClass = result.grade >= 4 ? 'grade-excellent' : (result.grade >= 3 ? 'grade-average' : 'grade-poor');
                showAlert(`Тест завершён! Ваш результат: ${result.score}/${result.total} (оценка: ${result.grade})`, 'success');
            }
        }

        function openPractice(lessonId, taskContent) {
            currentLessonId = lessonId;
            document.getElementById('practiceTask').innerHTML = `<p>${escapeHtml(taskContent)}</p>`;
            document.getElementById('assignmentContent').value = '';
            document.getElementById('assignmentFileName').value = '';
            openModal('practiceModal');
        }

        async function submitPractice() {
            const content = document.getElementById('assignmentContent').value;
            const fileName = document.getElementById('assignmentFileName').value || 'решение.txt';

            if (!content.trim()) {
                showAlert('Введите решение задания', 'error');
                return;
            }

            const result = await submitAssignment(currentLessonId, content, fileName);
            if (result) {
                closeModal('practiceModal');
                showAlert('Работа отправлена на проверку!', 'success');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
